<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cancel booking · Machine Booking</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <h1>Machine Booking<span class="dot">.</span></h1>
    <span class="sub"><a href="index.html">&larr; Calendar</a></span>
  </div>
</header>

<main class="wrap">
  <section class="card" style="max-width:480px">
    <h2>Cancel booking</h2>
    <div id="content"><p class="empty">Looking up your booking…</p></div>
  </section>
</main>

<script>
const CFG = window.BOOKING_CONFIG;
const db = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);
const content = document.getElementById('content');
const token = new URLSearchParams(location.search).get('token');

function fmtRange(b) {
  const s = new Date(b.starts_at), e = new Date(b.ends_at);
  const day = s.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const t = (d) => d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hour12: false });
  return `${day}, ${t(s)}–${t(e)}`;
}

function show(html) { content.innerHTML = html; }

async function init() {
  if (!token) {
    show('<p class="empty">This page needs a cancellation link. Check the link in your confirmation email.</p>');
    return;
  }
  const { data: b, error } = await db.rpc('booking_by_token', { p_token: token });
  if (error) {
    show('<p class="empty">Something went wrong looking up the booking. Try the link again.</p>');
    return;
  }
  if (!b) {
    show('<p class="empty">Booking not found — it may already have been cancelled.</p>');
    return;
  }
  if (b.ended) {
    show('<p class="empty">This booking has already finished, so there is nothing to cancel.</p>');
    return;
  }
  show(`
    <p><strong>${escapeHtml(b.machine)}</strong><br>
    <span class="mono" style="font-family:var(--mono);font-size:13px">${fmtRange(b)}</span><br>
    <span style="color:var(--muted)">Booked by ${escapeHtml(b.user_name)}</span></p>
    <div class="form-actions" style="justify-content:flex-start">
      <button class="primary" id="cancelBtn">Cancel this booking</button>
    </div>
    <p class="form-msg" id="msg" role="status"></p>
  `);
  document.getElementById('cancelBtn').onclick = doCancel;
}

async function doCancel() {
  const btn = document.getElementById('cancelBtn');
  const msg = document.getElementById('msg');
  btn.disabled = true;
  msg.textContent = 'Cancelling…';
  const { data: ok, error } = await db.rpc('cancel_booking', { p_token: token });
  if (error || !ok) {
    btn.disabled = false;
    msg.textContent = 'Could not cancel — the booking may already be cancelled or finished.';
    msg.className = 'form-msg error';
    return;
  }
  show('<p class="banner ok" style="margin-top:0">Booking cancelled. The slot is free again.</p><p><a href="index.html">Back to the calendar</a></p>');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

init();
</script>
</body>
</html>
