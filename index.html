<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Machine Booking</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <h1>Machine Booking<span class="dot">.</span></h1>
    <span class="sub"><a href="admin.html">Admin</a></span>
  </div>
</header>

<main class="wrap">
  <div class="tags" id="machineTags" role="group" aria-label="Choose a machine"></div>
  <p class="machine-desc" id="machineDesc"></p>

  <div class="week-bar">
    <span class="week-range" id="weekRange"></span>
    <div class="week-nav">
      <button id="prevWeek" aria-label="Previous week">&larr; Prev</button>
      <button id="todayBtn">Today</button>
      <button id="nextWeek" aria-label="Next week">Next &rarr;</button>
    </div>
  </div>

  <div class="cal-scroll">
    <div class="cal" id="calendar" aria-label="Weekly availability calendar"></div>
  </div>
  <div class="legend">
    <span><span class="chip booked"></span>Booked</span>
    <span><span class="chip free"></span>Available — click a slot to book</span>
  </div>
</main>

<dialog id="bookDialog">
  <div class="modal-head">
    <h2>Book <span id="dlgMachine"></span></h2>
    <button type="button" id="dlgClose" aria-label="Close">&times;</button>
  </div>
  <div class="modal-body">
    <form id="bookForm">
      <label for="fName">Your name</label>
      <input id="fName" type="text" required maxlength="80" autocomplete="name">
      <label for="fName">Project</label>
      <input id="fName" type="text" required maxlength="80" autocomplete="Project">
      <label for="fEmail">Email</label>
      <input id="fEmail" type="email" required maxlength="120" autocomplete="email">
      <label for="fDate">Date</label>
      <input id="fDate" type="date" required>
      <div class="row2">
        <div>
          <label for="fStart">Start time</label>
          <input id="fStart" type="time" step="900" required>
        </div>
        <div>
          <label for="fEnd">Finish time</label>
          <input id="fEnd" type="time" step="900" required>
        </div>
      </div>
      <div class="form-actions">
        <button type="button" class="quiet" id="dlgCancel">Cancel</button>
        <button type="submit" class="primary" id="dlgSubmit">Book machine</button>
      </div>
      <p class="form-msg" id="formMsg" role="status"></p>
    </form>
    <div id="successPanel" hidden>
      <p style="margin-top:0"><strong id="okSummary"></strong></p>
      <p class="form-msg" id="okEmailMsg" role="status"></p>
      <p style="font-size:13px">If you can't make it, use this link to cancel your booking:</p>
      <input id="okCancelLink" readonly style="font-family:var(--mono);font-size:12px" onclick="this.select()">
      <div class="form-actions">
        <button type="button" class="quiet" id="okCopy">Copy link</button>
        <button type="button" class="primary" id="okDone">Done</button>
      </div>
    </div>
  </div>
</dialog>

<script>
const CFG = window.BOOKING_CONFIG;
const db = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);

const HOUR_PX = 44;
const state = { machines: [], machineId: null, weekStart: startOfWeek(new Date()), bookings: [] };

const $ = (id) => document.getElementById(id);

function startOfWeek(d) {
  const x = new Date(d); x.setHours(0, 0, 0, 0);
  const day = (x.getDay() + 6) % 7; // Monday = 0
  x.setDate(x.getDate() - day);
  return x;
}
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function fmtDate(d) { return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }); }
function fmtTime(d) { return d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hour12: false }); }
function toLocalDateInput(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

async function loadMachines() {
  const { data, error } = await db.from('machines').select('id,name,description').order('name');
  if (error) { console.error(error); return; }
  state.machines = data;
  if (!state.machineId && data.length) state.machineId = data[0].id;
  renderTags();
}

function renderTags() {
  const wrap = $('machineTags');
  wrap.innerHTML = '';
  if (!state.machines.length) {
    wrap.innerHTML = '<p class="empty">No machines have been added yet.</p>';
    $('machineDesc').textContent = '';
    return;
  }
  state.machines.forEach((m) => {
    const b = document.createElement('button');
    b.className = 'tag';
    b.type = 'button';
    b.textContent = m.name;
    b.setAttribute('aria-pressed', String(m.id === state.machineId));
    b.onclick = () => { state.machineId = m.id; renderTags(); loadBookings(); };
    wrap.appendChild(b);
  });
  const cur = state.machines.find((m) => m.id === state.machineId);
  $('machineDesc').textContent = cur ? cur.description : '';
}

async function loadBookings() {
  if (!state.machineId) { state.bookings = []; renderCalendar(); return; }
  const from = state.weekStart.toISOString();
  const to = addDays(state.weekStart, 7).toISOString();
  const { data, error } = await db
    .from('bookings')
    .select('id,machine_id,user_name,starts_at,ends_at')
    .eq('machine_id', state.machineId)
    .lt('starts_at', to)
    .gt('ends_at', from)
    .order('starts_at');
  if (error) { console.error(error); return; }
  state.bookings = data.map((b) => ({ ...b, start: new Date(b.starts_at), end: new Date(b.ends_at) }));
  renderCalendar();
}

function renderCalendar() {
  const cal = $('calendar');
  cal.innerHTML = '';
  const hours = [];
  for (let h = CFG.DAY_START_HOUR; h < CFG.DAY_END_HOUR; h++) hours.push(h);

  const endOfWk = addDays(state.weekStart, 6);
  $('weekRange').textContent = `${fmtDate(state.weekStart)} – ${fmtDate(endOfWk)} ${endOfWk.getFullYear()}`;

  // Header row
  cal.appendChild(el('div', 'corner'));
  const todayStr = toLocalDateInput(new Date());
  for (let d = 0; d < 7; d++) {
    const day = addDays(state.weekStart, d);
    const h = el('div', 'day-head' + (toLocalDateInput(day) === todayStr ? ' today' : ''));
    h.innerHTML = `<div class="dow">${day.toLocaleDateString(undefined, { weekday: 'short' })}</div>
                   <div class="dom">${day.getDate()}</div>`;
    cal.appendChild(h);
  }

  // Time gutter
  const gutter = el('div');
  gutter.style.gridRow = '2'; gutter.style.gridColumn = '1';
  hours.forEach((h) => {
    const g = el('div', 'gutter');
    g.style.height = HOUR_PX + 'px';
    g.textContent = String(h).padStart(2, '0') + ':00';
    gutter.appendChild(g);
  });
  gutter.className = '';
  gutter.style.position = 'sticky'; gutter.style.left = '0'; gutter.style.zIndex = '2'; gutter.style.background = 'var(--surface)';
  cal.appendChild(gutter);

  // Day columns
  const now = new Date();
  for (let d = 0; d < 7; d++) {
    const day = addDays(state.weekStart, d);
    const col = el('div', 'col');
    col.style.gridRow = '2'; col.style.gridColumn = String(d + 2);
    hours.forEach((h) => {
      const cell = el('div', 'cell');
      const slotStart = new Date(day); slotStart.setHours(h, 0, 0, 0);
      if (slotStart < now) {
        cell.classList.add('past');
      } else {
        cell.title = 'Book this slot';
        cell.onclick = () => openDialog(slotStart);
      }
      col.appendChild(cell);
    });

    // Booking blocks for this day
    const dayStart = new Date(day); dayStart.setHours(CFG.DAY_START_HOUR, 0, 0, 0);
    const dayEnd = new Date(day); dayEnd.setHours(CFG.DAY_END_HOUR, 0, 0, 0);
    state.bookings.forEach((b) => {
      if (b.end <= dayStart || b.start >= dayEnd) return;
      const s = b.start < dayStart ? dayStart : b.start;
      const e = b.end > dayEnd ? dayEnd : b.end;
      const top = ((s - dayStart) / 3600000) * HOUR_PX;
      const height = Math.max(((e - s) / 3600000) * HOUR_PX - 3, 18);
      const blk = el('div', 'booking-block');
      blk.style.top = top + 'px';
      blk.style.height = height + 'px';
      blk.innerHTML = `<div class="who"></div><div class="when">${fmtTime(b.start)}–${fmtTime(b.end)}</div>`;
      blk.querySelector('.who').textContent = b.user_name;
      col.appendChild(blk);
    });
    cal.appendChild(col);
  }
}

function el(tag, cls) { const e = document.createElement(tag); if (cls) e.className = cls; return e; }

/* ── Booking dialog ── */
const dlg = $('bookDialog');

function openDialog(slotStart) {
  const m = state.machines.find((x) => x.id === state.machineId);
  $('dlgMachine').textContent = m ? m.name : '';
  $('bookForm').hidden = false;
  $('successPanel').hidden = true;
  $('fDate').value = toLocalDateInput(slotStart);
  $('fDate').min = toLocalDateInput(new Date());
  $('fStart').value = fmtTime(slotStart);
  const end = new Date(slotStart.getTime() + 3600000);
  $('fEnd').value = fmtTime(end);
  setMsg('');
  dlg.showModal();
}

function setMsg(text, cls) {
  const m = $('formMsg');
  m.textContent = text;
  m.className = 'form-msg' + (cls ? ' ' + cls : '');
}

$('dlgClose').onclick = () => dlg.close();
$('dlgCancel').onclick = () => dlg.close();

$('bookForm').onsubmit = async (ev) => {
  ev.preventDefault();
  const date = $('fDate').value;
  const start = new Date(`${date}T${$('fStart').value}`);
  const end = new Date(`${date}T${$('fEnd').value}`);

  if (!(end > start)) return setMsg('Finish time must be after the start time.', 'error');
  if (start < new Date()) return setMsg('That time is in the past — pick an upcoming slot.', 'error');

  // Friendly pre-check against bookings already on screen
  const clash = state.bookings.find((b) => start < b.end && end > b.start);
  if (clash) return setMsg(`That overlaps an existing booking (${fmtTime(clash.start)}–${fmtTime(clash.end)}).`, 'error');

  $('dlgSubmit').disabled = true;
  setMsg('Booking…');
  const { data, error } = await db.rpc('create_booking', {
    p_machine_id: state.machineId,
    p_name: $('fName').value.trim(),
    p_email: $('fEmail').value.trim(),
    p_starts_at: start.toISOString(),
    p_ends_at: end.toISOString(),
  });
  $('dlgSubmit').disabled = false;

  if (error) {
    // 23P01 = exclusion constraint: someone booked the slot a moment ago
    if (error.code === '23P01') {
      setMsg('That slot was just taken by someone else. Pick another time.', 'error');
      loadBookings();
    } else if (error.code === '23514') {
      setMsg('Please enter a valid email address.', 'error');
    } else {
      setMsg(error.message || 'Could not save the booking.', 'error');
    }
    return;
  }

  // Show success panel with the cancellation link
  const cancelUrl = `${location.origin}${location.pathname.replace(/[^/]*$/, '')}cancel.html?token=${data.cancel_token}`;
  const m = state.machines.find((x) => x.id === state.machineId);
  $('okSummary').textContent = `${m ? m.name : 'Machine'} booked, ${start.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' })}, ${fmtTime(start)}–${fmtTime(end)}.`;
  $('okCancelLink').value = cancelUrl;
  $('bookForm').hidden = true;
  $('successPanel').hidden = false;
  loadBookings();

  // Send the confirmation email (best effort)
  $('okEmailMsg').textContent = 'Sending confirmation email…';
  $('okEmailMsg').className = 'form-msg';
  try {
    const { data: mail, error: mailErr } = await db.functions.invoke('send-confirmation', {
      body: { booking_id: data.id, origin: location.origin },
    });
    if (!mailErr && mail && mail.sent) {
      $('okEmailMsg').textContent = 'A confirmation email with this link is on its way.';
      $('okEmailMsg').className = 'form-msg ok';
    } else {
      $('okEmailMsg').textContent = 'Confirmation email could not be sent — save the link below.';
      $('okEmailMsg').className = 'form-msg error';
    }
  } catch {
    $('okEmailMsg').textContent = 'Confirmation email could not be sent — save the link below.';
    $('okEmailMsg').className = 'form-msg error';
  }
};

$('okCopy').onclick = async () => {
  try {
    await navigator.clipboard.writeText($('okCancelLink').value);
    $('okCopy').textContent = 'Copied!';
    setTimeout(() => { $('okCopy').textContent = 'Copy link'; }, 1500);
  } catch {
    $('okCancelLink').select();
  }
};
$('okDone').onclick = () => dlg.close();

/* ── Week navigation ── */
$('prevWeek').onclick = () => { state.weekStart = addDays(state.weekStart, -7); loadBookings(); };
$('nextWeek').onclick = () => { state.weekStart = addDays(state.weekStart, 7); loadBookings(); };
$('todayBtn').onclick = () => { state.weekStart = startOfWeek(new Date()); loadBookings(); };

(async () => { await loadMachines(); await loadBookings(); })();
</script>
</body>
</html>
