<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · Machine Booking</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <h1>Machine Booking<span class="dot">.</span> <span style="color:var(--muted)">/ Admin</span></h1>
    <span class="sub"><a href="index.html">&larr; Calendar</a> &nbsp; <a href="#" id="logoutLink" hidden>Log out</a></span>
  </div>
</header>

<main class="wrap">

  <!-- Login -->
  <section class="card" id="loginCard" style="max-width:420px">
    <h2>Admin login</h2>
    <form id="loginForm">
      <label for="lEmail">Email</label>
      <input id="lEmail" type="email" required autocomplete="username">
      <label for="lPass">Password</label>
      <input id="lPass" type="password" required autocomplete="current-password">
      <div class="form-actions">
        <button type="submit" class="primary">Log in</button>
      </div>
      <p class="form-msg" id="loginMsg" role="status"></p>
    </form>
  </section>

  <!-- Admin panel -->
  <div id="panel" hidden>

    <section class="card">
      <h2>Machines</h2>
      <form id="machineForm">
        <div class="row2">
          <div>
            <label for="mName">Name</label>
            <input id="mName" type="text" required maxlength="80" placeholder="e.g. Laser Cutter">
          </div>
          <div>
            <label for="mDesc">Description</label>
            <input id="mDesc" type="text" maxlength="200" placeholder="Optional details shown to users">
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="quiet" id="mCancel" hidden>Cancel edit</button>
          <button type="submit" class="primary" id="mSubmit">Add machine</button>
        </div>
      </form>
      <div id="machineList"></div>
    </section>

    <section class="card">
      <h2>Upcoming bookings</h2>
      <div id="bookingList"></div>
    </section>

    <p class="banner" id="adminMsg" hidden></p>
  </div>
</main>

<script>
const CFG = window.BOOKING_CONFIG;
const db = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);
const $ = (id) => document.getElementById(id);
let editingId = null;

function flash(text, ok) {
  const b = $('adminMsg');
  b.textContent = text;
  b.className = 'banner ' + (ok ? 'ok' : 'error');
  b.hidden = false;
  clearTimeout(flash.t);
  flash.t = setTimeout(() => { b.hidden = true; }, 4000);
}

/* ── Auth ── */
async function refreshAuth() {
  const { data: { session } } = await db.auth.getSession();
  const loggedIn = !!session;
  $('loginCard').hidden = loggedIn;
  $('panel').hidden = !loggedIn;
  $('logoutLink').hidden = !loggedIn;
  if (loggedIn) { loadMachines(); loadBookings(); }
}

$('loginForm').onsubmit = async (ev) => {
  ev.preventDefault();
  const m = $('loginMsg');
  m.textContent = 'Logging in…'; m.className = 'form-msg';
  const { error } = await db.auth.signInWithPassword({
    email: $('lEmail').value.trim(),
    password: $('lPass').value,
  });
  if (error) { m.textContent = 'Login failed: ' + error.message; m.className = 'form-msg error'; return; }
  m.textContent = '';
  refreshAuth();
};

$('logoutLink').onclick = async (ev) => {
  ev.preventDefault();
  await db.auth.signOut();
  refreshAuth();
};

/* ── Machines ── */
async function loadMachines() {
  const { data, error } = await db.from('machines').select('*').order('name');
  const wrap = $('machineList');
  if (error) { wrap.innerHTML = '<p class="empty">Could not load machines.</p>'; return; }
  if (!data.length) { wrap.innerHTML = '<p class="empty">No machines yet — add the first one above.</p>'; return; }

  const table = document.createElement('table');
  table.innerHTML = '<thead><tr><th>Name</th><th>Description</th><th style="width:160px"></th></tr></thead>';
  const tbody = document.createElement('tbody');
  data.forEach((m) => {
    const tr = document.createElement('tr');
    const tdN = document.createElement('td'); tdN.textContent = m.name;
    const tdD = document.createElement('td'); tdD.textContent = m.description; tdD.style.color = 'var(--muted)';
    const tdA = document.createElement('td');
    const eBtn = document.createElement('button'); eBtn.textContent = 'Edit'; eBtn.style.marginRight = '8px';
    eBtn.onclick = () => startEdit(m);
    const dBtn = document.createElement('button'); dBtn.textContent = 'Delete'; dBtn.className = 'quiet';
    dBtn.onclick = () => deleteMachine(m);
    tdA.append(eBtn, dBtn);
    tr.append(tdN, tdD, tdA);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.innerHTML = '';
  wrap.appendChild(table);
}

function startEdit(m) {
  editingId = m.id;
  $('mName').value = m.name;
  $('mDesc').value = m.description;
  $('mSubmit').textContent = 'Save changes';
  $('mCancel').hidden = false;
  $('mName').focus();
}

function resetMachineForm() {
  editingId = null;
  $('machineForm').reset();
  $('mSubmit').textContent = 'Add machine';
  $('mCancel').hidden = true;
}

$('mCancel').onclick = resetMachineForm;

$('machineForm').onsubmit = async (ev) => {
  ev.preventDefault();
  const payload = { name: $('mName').value.trim(), description: $('mDesc').value.trim() };
  let error, data;
  if (editingId) {
    ({ data, error } = await db.from('machines').update(payload).eq('id', editingId).select());
  } else {
    ({ data, error } = await db.from('machines').insert(payload).select());
  }
  if (error) {
    flash(error.code === '42501'
      ? 'Not allowed — your login is not on the admin list. Add your email to the app_admins table in Supabase.'
      : 'Could not save machine: ' + error.message, false);
    return;
  }
  if (!data || !data.length) {
    flash('No change was made — your login is not on the admin list. Add your email to the app_admins table in Supabase.', false);
    return;
  }
  flash(editingId ? 'Machine updated.' : 'Machine added.', true);
  resetMachineForm();
  loadMachines();
};

async function deleteMachine(m) {
  if (!confirm(`Delete "${m.name}"? All of its bookings will be removed too.`)) return;
  const { data, error } = await db.from('machines').delete().eq('id', m.id).select();
  if (error) { flash('Could not delete: ' + error.message, false); return; }
  if (!data || !data.length) {
    flash('Nothing was deleted — your login is not on the admin list. Add your email to the app_admins table in Supabase.', false);
    return;
  }
  flash('Machine deleted.', true);
  loadMachines();
  loadBookings();
}

/* ── Bookings ── */
async function loadBookings() {
  const { data, error } = await db
    .from('bookings')
    .select('id,user_name,user_email,starts_at,ends_at,machines(name)')
    .gte('ends_at', new Date().toISOString())
    .order('starts_at')
    .limit(200);
  const wrap = $('bookingList');
  if (error) { wrap.innerHTML = '<p class="empty">Could not load bookings.</p>'; return; }
  if (!data.length) { wrap.innerHTML = '<p class="empty">No upcoming bookings.</p>'; return; }

  const fmt = (iso) => new Date(iso).toLocaleString(undefined, {
    weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false,
  });
  const fmtEnd = (iso) => new Date(iso).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hour12: false });

  const table = document.createElement('table');
  table.innerHTML = '<thead><tr><th>Machine</th><th>When</th><th>Name</th><th>Email</th><th style="width:90px"></th></tr></thead>';
  const tbody = document.createElement('tbody');
  data.forEach((b) => {
    const tr = document.createElement('tr');
    const tdM = document.createElement('td'); tdM.textContent = b.machines ? b.machines.name : '—';
    const tdW = document.createElement('td'); tdW.className = 'mono';
    tdW.textContent = `${fmt(b.starts_at)} – ${fmtEnd(b.ends_at)}`;
    const tdN = document.createElement('td'); tdN.textContent = b.user_name;
    const tdE = document.createElement('td'); tdE.textContent = b.user_email; tdE.style.color = 'var(--muted)';
    const tdA = document.createElement('td');
    const dBtn = document.createElement('button'); dBtn.textContent = 'Cancel'; dBtn.className = 'quiet';
    dBtn.onclick = async () => {
      if (!confirm(`Cancel ${b.user_name}'s booking?`)) return;
      const { data: del, error: e2 } = await db.from('bookings').delete().eq('id', b.id).select();
      if (e2) { flash('Could not cancel: ' + e2.message, false); return; }
      if (!del || !del.length) {
        flash('Nothing was cancelled — your login is not on the admin list.', false);
        return;
      }
      flash('Booking cancelled.', true);
      loadBookings();
    };
    tdA.appendChild(dBtn);
    tr.append(tdM, tdW, tdN, tdE, tdA);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.innerHTML = '';
  wrap.appendChild(table);
}

refreshAuth();
</script>
</body>
</html>
